<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Encapsulation</title>
<desc id="d">Data is wrapped in an IP header to form a packet, and the packet is wrapped in a MAC header and trailer to form a frame.</desc>
<rect x="10" y="10" width="700" height="230" rx="12" fill="#f2f5f9" stroke="#dde4ee"/>
<text x="360" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1b2d">Each layer wraps the data it receives</text>
<rect x="40" y="60" width="640" height="150" rx="10" fill="#e6edff" stroke="#2f5bea" stroke-width="2"/>
<text x="52" y="82" font-size="14" font-weight="700" fill="#2f5bea">Frame (data link layer)</text>
<rect x="60" y="95" width="100" height="95" rx="6" fill="#fff" stroke="#2f5bea"/>
<text x="110" y="135" text-anchor="middle" font-size="14" fill="#0f1b2d">MAC</text>
<text x="110" y="153" text-anchor="middle" font-size="14" fill="#0f1b2d">header</text>
<rect x="175" y="95" width="360" height="95" rx="8" fill="#fff4dc" stroke="#f5a524" stroke-width="2"/>
<text x="187" y="115" font-size="14" font-weight="700" fill="#8a5a00">Packet (network layer)</text>
<rect x="190" y="125" width="95" height="52" rx="6" fill="#fff" stroke="#f5a524"/>
<text x="237" y="148" text-anchor="middle" font-size="14" fill="#0f1b2d">IP</text>
<text x="237" y="165" text-anchor="middle" font-size="14" fill="#0f1b2d">header</text>
<rect x="300" y="125" width="220" height="52" rx="6" fill="#fff" stroke="#f5a524"/>
<text x="410" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1b2d">Data</text>
<rect x="550" y="95" width="110" height="95" rx="6" fill="#fff" stroke="#2f5bea"/>
<text x="605" y="135" text-anchor="middle" font-size="14" fill="#0f1b2d">MAC</text>
<text x="605" y="153" text-anchor="middle" font-size="14" fill="#0f1b2d">trailer</text>
</svg>
