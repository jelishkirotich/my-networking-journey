<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Network types by size</title>
<desc id="d">Five bars of growing length: PAN, LAN, CAN, MAN and WAN, each with an example of its reach.</desc>
<rect x="10" y="10" width="700" height="280" rx="12" fill="#f2f5f9" stroke="#dde4ee"/>
<g font-size="15" fill="#fff" font-weight="700">
<rect x="30" y="28" width="150" height="40" rx="8" fill="#2f5bea" opacity=".55"/><text x="42" y="53">PAN</text>
<rect x="30" y="80" width="270" height="40" rx="8" fill="#2f5bea" opacity=".68"/><text x="42" y="105">LAN</text>
<rect x="30" y="132" width="400" height="40" rx="8" fill="#2f5bea" opacity=".8"/><text x="42" y="157">CAN</text>
<rect x="30" y="184" width="530" height="40" rx="8" fill="#2f5bea" opacity=".9"/><text x="42" y="209">MAN</text>
<rect x="30" y="236" width="660" height="40" rx="8" fill="#0f1b2d"/><text x="42" y="261">WAN</text>
</g>
<g font-size="14" fill="#0f1b2d">
<text x="192" y="53">Phone and earbuds</text>
<text x="312" y="105">Home, office or one building</text>
<text x="442" y="157">University campus</text>
<text x="572" y="209">A city</text>
</g>
<text x="560" y="261" font-size="14" fill="#fff" text-anchor="end">Countries and continents</text>
</svg>
