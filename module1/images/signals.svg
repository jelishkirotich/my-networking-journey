<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Analog and digital signals</title>
<desc id="d">An analog signal drawn as a smooth wave and a digital signal drawn as a square wave carrying the bits 1 0 1 1 0 0 1 0.</desc>
<rect x="10" y="10" width="700" height="200" rx="12" fill="#f2f5f9" stroke="#dde4ee"/>
<g font-size="16" font-weight="700" fill="#0f1b2d" text-anchor="middle"><text x="180" y="40">Analog signal</text><text x="534" y="40">Digital signal</text></g>
<path d="M30 120 q25 -60 50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#2f5bea" stroke-width="3"/>
<path d="M390 80 h36 V150 h36 V80 h72 V150 h72 V80 h36 V150 h36" fill="none" stroke="#f5a524" stroke-width="3"/>
<g font-size="14" fill="#566176" text-anchor="middle">
<text x="180" y="185">Changes smoothly and continuously</text>
<text x="408" y="172">1</text><text x="444" y="172">0</text><text x="480" y="172">1</text><text x="516" y="172">1</text><text x="552" y="172">0</text><text x="588" y="172">0</text><text x="624" y="172">1</text><text x="660" y="172">0</text>
<text x="534" y="195">Jumps between two levels</text>
</g>
</svg>
