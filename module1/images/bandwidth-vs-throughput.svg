<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Bandwidth compared with throughput</title>
<desc id="d">A full bar shows a 100 Mbps link capacity. A shorter bar inside it shows 72 Mbps actually delivered.</desc>
<rect x="10" y="10" width="700" height="180" rx="12" fill="#f2f5f9" stroke="#dde4ee"/>
<text x="30" y="45" font-size="15" font-weight="700" fill="#0f1b2d">Bandwidth: what the link can carry</text>
<rect x="30" y="55" width="660" height="34" rx="6" fill="#2f5bea"/>
<text x="680" y="78" font-size="15" font-weight="700" fill="#fff" text-anchor="end">100 Mbps</text>
<text x="30" y="125" font-size="15" font-weight="700" fill="#0f1b2d">Throughput: what is actually delivered</text>
<rect x="30" y="135" width="660" height="34" rx="6" fill="#dde4ee"/>
<rect x="30" y="135" width="475" height="34" rx="6" fill="#f5a524"/>
<text x="495" y="158" font-size="15" font-weight="700" fill="#0f1b2d" text-anchor="end">72 Mbps</text>
</svg>
